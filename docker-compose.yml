# Arranque:  docker compose up -d --build        Ver web: http://localhost:<web.port de race.cfg>
# restart: unless-stopped => vuelve solo tras reiniciar el equipo si estaba arrancado; si lo paras tú, no.
# Borrar datos:  docker compose down -v   (o reset_db = always en race.cfg)
# network_mode: host => el puerto sale de race.cfg (Linux). En Windows/Mac usa ports: ["8090:8090"] y quita network_mode.
services:
  collector:
    build: .
    command: python collector.py
    restart: unless-stopped
    volumes: ["./race.cfg:/app/race.cfg:ro", "data:/data"]
  web:
    build: .
    command: python web.py
    restart: unless-stopped
    depends_on: [collector]
    networks: [default, proxy-net]
    volumes: ["./race.cfg:/app/race.cfg:ro", "data:/data"]
    
volumes:
  data:

networks:
  proxy-net:
    external: true         