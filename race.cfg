; ===== CONFIGURACION DE LA CARRERA =====  (vacio = no aplica; false = desactivado)
[race]
; name = 30H Campillos 2026
; race_url = https://live.apex-timing.com/cronosystem2/
; wss_url = wss://live-data.apex-timing.com:8803/
name = Karting Campillos
race_url = https://www.apex-timing.com/live-timing/kartcenter-campillos/index.html
wss_url = wss://live-data.apex-timing.com:9373/
history_port = 8800        ; puerto de request.php para recuperar vueltas antiguas
follow = 6,12,21           ; karts a seguir (fondo distinto en la tabla)
duration_h = 30

[web]
port = 8090                ; puerto de la web (usa network_mode: host en docker-compose)

[storage]
reset_db = new_race        ; new_race = borra si cambia wss_url/race_url | always = borra en CADA arranque | never

[rules]                    ; normativa. Minutos salvo *_s (segundos)
min_stops =                ; paradas minimas
max_stops =
min_pit_s = 150            ; tiempo minimo en box por parada
max_stint_min = 120        ; maximo seguido en pista por stint
min_stint_min =            ; minimo por stint
min_driver_min =           ; minimo total por piloto
max_driver_min =           ; maximo total por piloto
pit_close_remaining_min = 30 ; el pit cierra cuando quedan N min
no_pit_first_min =         ; [informativo, aun sin alertas] sin paradas los primeros N min
mandatory_driver_change = false ; [informativo, aun sin alertas]
stint_tolerance_s =        ; [informativo, aun sin alertas]

[alerts]
stint_yellow_pct = 12      ; amarillo si queda <=12% del stint maximo
stint_red_pct = 6
driver_slower_yellow_s = 0.5 ; stint mas lento que stints previos del mismo piloto
driver_slower_red_s = 1.0
team_slower_yellow_s = 0.8   ; si el piloto no tiene stints previos: vs companeros
team_slower_red_s = 1.5
lap_slow_s = 1.5             ; ultima vuelta vs media de las 3 anteriores
kart_window_min = 15         ; ventana de entradas a box para valorar la "cola de karts"
kart_fast_count = 3
kart_slow_count = 3
kart_fast_delta_s = -0.15
kart_slow_delta_s = 0.20
kart_queue_min = 2          ; karts que esperan en la fila de salida (min/max estimados; la probabilidad se calcula sobre este rango)
kart_queue_max = 6
kart_max_wait_min = 8        ; no recomendar esperar mas de N min para entrar
stopped_factor = 2.5         ; rojo si lleva N vueltas medias sin pasar por meta
